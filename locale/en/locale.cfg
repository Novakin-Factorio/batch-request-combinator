command-stats-help=Print Batch Request Combinator status and performance statistics.

[batch-request-combinator-error]
no-targets=Connect at least one compatible requester chest to the combinator’s output circuit network.
target-conflict=Wait for the other batch to finish, or disconnect its requester chest from this combinator.
target-incompatible=Restore compatible settings on the affected requester chest, disconnect it, or replace it.
contamination=Remove the unrelated item from the affected requester chest. The mod did not move it.
excess-items=Remove the quantity above this batch’s allocation from the affected requester chest.
insufficient-capacity=Free requester-chest space, connect more compatible requester chests, or reduce the request.
insufficient-filters=Reduce the number of item-and-quality requests assigned to the chest, or connect more requester chests.
request-write-failed=Check the affected chest’s logistic settings and remove any conflicting request configuration.
target-lost=Restore the intended requester chest and output wiring before starting another batch.
delivery-mismatch=Check the requester contents, loading inserter hands, and any external changes before starting another batch.
inserter-not-empty=Empty the affected loading inserter’s hand before starting another batch.
external-request=Disable or remove the conflicting manual or circuit-controlled request, or use another requester chest.
external-delivery=Wait for the conflicting robot transfer to finish and remove the request that created it.
output-unavailable=Check the combinator’s output wiring and Technical details.
invalid-quantity=Correct the invalid or unsupported item quantity on the circuit input.
section-lost=Check the affected chest’s logistic settings before starting another batch.
inaccessible-items=Move or remove the items behind the affected chest’s red inventory bar. The mod did not move them.
tail-plan-unsafe=Adjust the request, requester capacity, filters, or tail mode.
planning-limit=Split the request into smaller independent batches.
inserter-configuration=Correct the affected loading inserter or the number of inserters connected for the selected tail mode.
inserter-ownership=Wait for the other batch, restore the affected inserter, or undo the external stack-size change. The mod did not overwrite it.
tail-restore-failed=Restore the affected inserter’s previous stack-size setting. The inserter remains reserved until restoration succeeds.
drain-write-failed=Check the affected requester chest. Any Trash unrequested changes already made by this cleanup attempt were restored.
drain-restore-failed=Restore the affected requester chest’s previous Trash unrequested setting. The chest remains reserved until restoration succeeds.
drain-input-active=Draining requires all accepted item signals to be zero. Set them to zero, then try again.
drain-scope-changed=The connected requester chests or item quantity changed after the preview. Open Maintenance again to refresh the preview before draining.
internal=Check Technical details. If the error repeats, report the error code and detail to the mod author.
unknown=Check Technical details. If the error repeats, report the error code and detail to the mod author.
