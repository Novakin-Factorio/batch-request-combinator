[virtual-signal-description]
batch-request-combinator-armed=The combinator is ready and waiting for a new nonzero item request.
batch-request-combinator-requesting=Logistic requests are active for the current batch.
batch-request-combinator-settling=Logistic requests are off while remaining robot deliveries and pickups finish.
batch-request-combinator-ready=The batch is ready for loading from the requester chests, and loading inserters may run.
batch-request-combinator-complete=The requester chests and loading inserter hands are empty.
batch-request-combinator-warning=This signal becomes 1 if a nonzero accepted input differs from the captured batch. It remains active for the rest of that batch. Open the combinator for details.
batch-request-combinator-error=The value is an error code; loading remains disabled.
batch-request-combinator-aborted=The previous batch or requester-chest drain has ended. Set all accepted item signals to zero to prepare the next batch.

[mod-setting-name]
batch-request-combinator-requester-capacity=Batch-Combinator Requester capacity
batch-request-combinator-poll-interval=Batch input check interval
batch-request-combinator-debug=Batch Request Combinator debug mode

[mod-setting-description]
batch-request-combinator-requester-capacity=Inventory slots in every Batch-Combinator Requester. Applied when Factorio starts. Existing chests use the new capacity after restart; reduce it only when the removed slots are empty. Default: 5,000. Range: 48–5,000.
batch-request-combinator-poll-interval=Ticks between circuit-input checks for each combinator. Lower values react faster but increase processing cost. Default: 12. Range: 1–60.
batch-request-combinator-debug=Records additional diagnostic counters and performance timings. Leave disabled unless you are troubleshooting the mod.

