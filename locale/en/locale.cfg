input-mode-follow=Follow input
input-mode-follow-description=If the input becomes zero before the batch finishes, the batch stops. After completion, zero prepares the combinator for the next batch.
input-mode-snapshot=Snapshot
input-mode-snapshot-description=The captured batch continues when the input becomes zero. After completion, the COMPLETE signal remains active for at least one input check. If the input is zero, the combinator then prepares the next batch.
tail-mode-none=No tail flush
tail-mode-none-description=The mod never claims or changes inserter settings. Every monitored hand must be empty before staging; topology and hands are checked again at readiness and completion barriers.
tail-mode-single=Single tail inserter
tail-mode-single-description=Routes all final partial loads through one inserter lane. Use only when all lanes feed the same destination.
tail-mode-parallel=Parallel tail inserters
tail-mode-parallel-description=Lets each eligible inserter release its final partial load independently. Use when lanes feed separate destinations.
