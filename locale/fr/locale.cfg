batch-request-combinator-aborted=Lot annulé

[virtual-signal-description]
batch-request-combinator-armed=Le combinateur attend un front d'entrée valide de zéro vers une valeur non nulle.
batch-request-combinator-requesting=Le lot capturé est en cours de préparation par le réseau logistique.
batch-request-combinator-settling=Les requêtes sont désactivées pendant la fin des livraisons ciblées restantes.
batch-request-combinator-ready=Le lot exact est préparé, les requêtes sont désactivées et les bras de chargement peuvent fonctionner.
batch-request-combinator-complete=Les coffres de demande gérés et les mains des bras surveillés sont entièrement vidés.
batch-request-combinator-warning=La valeur passe à 1 si une entrée acceptée non nulle diffère du lot capturé. Elle reste active jusqu’à la fin de ce lot. Ouvrez le combinateur pour en savoir plus.
batch-request-combinator-error=La valeur est un code d'erreur ; le chargement reste désactivé.
batch-request-combinator-aborted=Le lot ou le vidage précédent est terminé. Mettez tous les signaux d’objet acceptés à zéro pour préparer le lot suivant.

[mod-setting-name]
batch-request-combinator-requester-capacity=Capacité du coffre demandeur Batch-Combinator
batch-request-combinator-poll-interval=Intervalle d'analyse des entrées de lot
batch-request-combinator-debug=Mode de débogage du combinateur de requête par lot

[mod-setting-description]
batch-request-combinator-requester-capacity=Nombre d'emplacements de chaque coffre demandeur Batch-Combinator. Appliqué au démarrage de Factorio. Après redémarrage, les coffres existants utilisent la nouvelle capacité ; ne la réduisez que si les emplacements supprimés sont vides. Valeur par défaut : 5 000. Plage : 48 à 5 000.
batch-request-combinator-poll-interval=Nombre de ticks entre les vérifications échelonnées des entrées de circuit de chaque combinateur. Une valeur basse réagit plus vite mais effectue davantage de vérifications. Valeur par défaut : 12. Plage : 1 à 60.
batch-request-combinator-debug=Active des diagnostics limités et des résumés du profileur. Les messages de jeu normaux restent silencieux lorsque ce mode est désactivé.

