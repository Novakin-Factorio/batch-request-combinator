[item-name]
batch-request-combinator=Combinateur de requête par lot
batch-combinator-requester=Coffre demandeur Batch-Combinator

[item-description]
batch-request-combinator=Capture un seul lot demandé par circuit, le prépare dans des coffres de demande, puis n'autorise le chargement qu'après l'arrêt des requêtes et la fin des livraisons.
batch-combinator-requester=Coffre demandeur dédié à livraison exacte, dont la capacité est définie dans les paramètres de démarrage du mod.

[entity-name]
batch-request-combinator=Combinateur de requête par lot
batch-request-combinator-output=Émetteur caché du combinateur de requête par lot
batch-combinator-requester=Coffre demandeur Batch-Combinator

[entity-description]
batch-request-combinator=Reliez les demandes d'objets au côté entrée, puis les coffres de demande et les bras de chargement au côté sortie.
batch-request-combinator-output=Émetteur de signaux caché et contrôlé par script pour un combinateur de requête par lot.
batch-combinator-requester=Demande aux robots logistiques des quantités exactes. Sa capacité est définie dans les paramètres de démarrage du mod.

[recipe-name]
batch-request-combinator=Combinateur de requête par lot
batch-combinator-requester=Coffre demandeur Batch-Combinator

[technology-name]
batch-request-combinator=Logistique des requêtes par lot

[technology-description]
batch-request-combinator=Capture une requête de circuit unique, prépare sa quantité exacte par logistique et n'autorise le chargement qu'après la fin des livraisons robotisées.

