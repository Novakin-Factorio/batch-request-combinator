technical-inserter-requirements=Conditions des bras de chargement : chaque bras surveillé doit prélever nativement dans un coffre demandeur connecté, sélectionner au moins une couleur d'entrée de circuit rouge ou verte physiquement reliée à la sortie de ce combinateur et commencer avec une main vide. Le mode Aucun autorise un nombre quelconque de bras par coffre et ne réserve ni ne modifie automatiquement leurs réglages pendant un lot. Le mode Unique exige exactement un bras par coffre demandeur. Le mode Parallèle en exige au moins un par coffre et n'en autorise plusieurs sur un même coffre que si leurs tailles de transfert effectives correspondent pour chaque identité d'objet capturée. La taille de transfert effective est la plus petite valeur entre la quantité de prélèvement cible actuelle et la taille de pile de l'objet ; faites correspondre les quantités de prélèvement effectives, généralement avec une même limite de taille de pile prise en charge par tous les bras du coffre. L'action de configuration à entrée nulle ne peut pas valider cette règle dépendante des objets ; le minimum par coffre du mode Parallèle est vérifié au démarrage du lot. Chaque bras contrôlé automatiquement doit utiliser l'activation par circuit avec PRÊT > 0 et désactiver l'activation par réseau logistique, le contrôle de taille de pile par circuit et le contrôle des filtres par circuit. Si Utiliser les filtres est désactivé, tous les emplacements de filtre fixes doivent être vides. Si Utiliser les filtres est activé, le mode liste blanche est obligatoire et les filtres fixes doivent correspondre exactement à toutes les combinaisons d'objet et de qualité attribuées.
