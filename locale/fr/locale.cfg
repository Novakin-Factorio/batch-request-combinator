[batch-request-combinator-error]
no-targets=Reliez au moins un coffre demandeur compatible au réseau de circuit de sortie du combinateur.
target-conflict=Attendez la fin de l'autre lot ou déconnectez son coffre demandeur de ce combinateur.
target-incompatible=Restaurez des réglages compatibles sur le coffre demandeur concerné, déconnectez-le ou remplacez-le.
contamination=Retirez l'objet étranger du coffre demandeur concerné. Le mod ne l'a pas déplacé.
excess-items=Retirez du coffre demandeur la quantité qui dépasse l'attribution de ce lot.
insufficient-capacity=Libérez de la place, reliez davantage de coffres demandeurs compatibles ou réduisez la demande.
insufficient-filters=Réduisez le nombre de requêtes d'objet et de qualité attribuées au coffre, ou reliez davantage de coffres demandeurs.
request-write-failed=Vérifiez les réglages logistiques du coffre concerné et supprimez toute configuration de requête conflictuelle.
target-lost=Restaurez le coffre demandeur prévu et son câblage de sortie avant de lancer un autre lot.
delivery-mismatch=Vérifiez le contenu des coffres, les mains des bras de chargement et toute modification extérieure avant de lancer un autre lot.
inserter-not-empty=Videz la main du bras de chargement concerné avant de lancer un autre lot.
external-request=Désactivez ou supprimez la requête manuelle ou contrôlée par circuit conflictuelle, ou utilisez un autre coffre demandeur.
external-delivery=Attendez la fin du transfert robot conflictuel et supprimez la requête qui l'a créé.
output-unavailable=Vérifiez le câblage de sortie du combinateur et les Détails techniques.
invalid-quantity=Corrigez la quantité d'objet invalide ou non prise en charge sur l'entrée de circuit.
section-lost=Vérifiez les réglages logistiques du coffre concerné avant de lancer un autre lot.
inaccessible-items=Déplacez ou retirez les objets derrière la barre rouge du coffre concerné. Le mod ne les a pas déplacés.
tail-plan-unsafe=Ajustez la demande, la capacité des coffres, les filtres ou le mode de fin de lot.
planning-limit=Divisez la demande en lots indépendants plus petits.
inserter-configuration=Corrigez le bras de chargement concerné ou le nombre de bras connectés pour le mode de fin sélectionné.
inserter-ownership=Attendez l'autre lot, restaurez le bras concerné ou annulez la modification extérieure de taille de pile. Le mod ne l'a pas écrasée.
tail-restore-failed=Restaurez le réglage précédent de taille de pile du bras concerné. Le bras reste réservé jusqu'à la réussite de la restauration.
drain-write-failed=Vérifiez le coffre demandeur concerné. Toute modification de Mettre à la poubelle les objets non demandés déjà effectuée pendant cette tentative a été restaurée.
drain-restore-failed=Restaurez le réglage précédent Mettre à la poubelle les objets non demandés du coffre concerné. Le coffre reste réservé jusqu'à la réussite de la restauration.
drain-input-active=Le vidage exige que tous les signaux d'objet acceptés soient à zéro. Remettez-les à zéro, puis réessayez.
drain-scope-changed=Les coffres demandeurs connectés ou la quantité d'objets ont changé après l'aperçu. Rouvrez Maintenance pour actualiser l'aperçu avant de vider.
internal=Consultez les Détails techniques. Si l'erreur se répète, communiquez son code et son détail à l'auteur du mod.
unknown=Consultez les Détails techniques. Si l'erreur se répète, communiquez son code et son détail à l'auteur du mod.
