sign-mode-positive=Valeurs positives uniquement
sign-mode-negative-absolute=Valeurs négatives uniquement, valeur absolue
input-mode-follow=Suivre l'entrée
input-mode-follow-description=Le zéro interrompt en sécurité un lot incomplet. Après TERMINÉ, le zéro réarme le combinateur.
input-mode-snapshot=Instantané
input-mode-snapshot-description=Le lot capturé continue lorsque l'entrée passe à zéro. Après la fin, le signal TERMINÉ reste actif pendant au moins une vérification d'entrée. Si l'entrée est à zéro, le combinateur prépare ensuite le lot suivant.
tail-mode-none=Aucun vidage de fin de lot
tail-mode-none-description=Le mode Aucun ne réserve aucun bras et ne modifie pas automatiquement leurs réglages pendant un lot. L'action explicite Configurer les bras peut tout de même les modifier à l'état ARMÉ. Un nombre quelconque de bras peut être surveillé pour chaque coffre demandeur. Chaque main surveillée doit être vide avant la préparation ; la topologie et les mains sont revérifiées avant PRÊT et TERMINÉ.
tail-mode-single=Un bras de fin de lot
tail-mode-single-description=Achemine tous les chargements finaux partiels par une seule voie de chargement déterministe. Exige exactement un bras de chargement admissible par coffre demandeur. À utiliser uniquement lorsque toutes les voies alimentent la même destination.
tail-mode-parallel=Bras de fin de lot parallèles
tail-mode-parallel-description=Permet à chaque bras admissible de libérer indépendamment son chargement final partiel. Exige au moins un bras par coffre demandeur. Pour chaque identité d'objet capturée, les bras d'un même coffre doivent partager la plus petite valeur entre leur quantité de prélèvement cible actuelle et la taille de pile de l'objet. Faites correspondre les quantités de prélèvement effectives, généralement avec une même limite de taille de pile prise en charge par tous. L'action de configuration à entrée nulle ne peut pas valider cette règle. À utiliser lorsque les voies alimentent des destinations séparées.
status-armed=En attente d'une nouvelle demande d'objets non nulle.
status-draining=La mise à la poubelle des objets non demandés est temporairement active sur les coffres possédés. Attente que les inventaires, les mains surveillées et l'activité robotisée ciblée soient vides.
status-requesting=Les requêtes logistiques sont actives. Le chargement reste bloqué pendant la préparation exacte et l'évacuation native des surplus par les cases de rebut.
status-settling=Les requêtes sont désactivées ; attente de la fin des livraisons et prélèvements ciblés.
status-ready=Le lot est préparé ; le chargement reste autorisé.
status-complete=Les coffres de demande gérés et les mains des bras surveillés sont vides. Ramenez l'entrée à zéro pour réarmer.
status-error=Le lot est arrêté ; le chargement reste désactivé. Corrigez l'erreur et remettez l'entrée à zéro pour réarmer.
status-aborted=Le lot précédent ou le vidage des coffres demandeurs est terminé. Remettez tous les signaux d'objet acceptés à zéro pour préparer le lot suivant.
status-reset=Les requêtes et contrôles possédés sont restaurés avant le réarmement.
condition-destination-blocked=Condition : destination bloquée. La sortie de circuit PRÊT reste active.
condition-tail-waiting=Condition : attente de la fin de lot. Le chargement est autorisé ; attente de la libération d'une main partielle admissible.
condition-monitored-hand-waiting=Condition : attente du vidage des mains des bras. Attente que chaque main surveillée soit vide avant la fin du lot.
condition-manual-tail-waiting=Récupération manuelle de fin de lot requise. Le traitement automatique s'est arrêté après trois tentatives infructueuses. Dégagez l'obstruction, puis réessayez.
condition-drain-waiting-network=Le nettoyage attend que les coffres de demande rejoignent un réseau logistique.
condition-drain-waiting-robots=Le nettoyage attend l'ajout de robots logistiques dans le réseau.
condition-drain-waiting-available-robots=Le nettoyage attend qu'un robot logistique soit disponible.
condition-drain-waiting-destination=Le nettoyage attend un stockage logistique disposant de place libre.
condition-drain-waiting-movement=Le nettoyage attend que le réseau logistique déplace les objets restants.
status-error-detail=Erreur : __1__
warning-input-changed=Une entrée acceptée non nulle diffère du lot capturé. La demande capturée initiale est conservée. Remettez tous les signaux d'objet acceptés à zéro avant de lancer le lot suivant.
info-snapshot-reset=Une entrée nulle a été enregistrée. Le lot Instantané capturé continue.
warning-snapshot-new-input=Une nouvelle entrée est arrivée après l'enregistrement du zéro en mode Instantané. Elle n'a pas été ajoutée au lot capturé. Remettez tous les signaux d'objet acceptés à zéro avant de lancer le lot suivant.
